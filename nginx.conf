server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml font/woff2;

    # Assets do Vite têm hash no nome do arquivo: podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html NUNCA pode ficar em cache: é ele quem referencia os arquivos
    # com hash da build atual. Sem isso, navegador/proxy servem uma versão
    # antiga da página (que aponta pra JS/CSS antigos) até um hard-refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # SPA: qualquer rota que não seja um arquivo real cai no index.html
    # (equivalente ao rewrite do vercel.json / public/_redirects).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
